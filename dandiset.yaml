description: This dataset contains (1) Kilosorted data from chronically implanted
  Neuropixels probe(s), (2) video data from 6 Basler cameras with synchronized frames,
  (3) 3D keypoint positions of 20 keypoints across the entire body as estimated by
  DANNCE. This data is collected from a Long Evans rat as she spontaneously explores
  a ~1m diameter open arena. Data collected in Bence Ölveckzy's laboratory.
